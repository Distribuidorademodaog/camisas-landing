    if (window.fbq) {
      fbq('track', 'Purchase', {

        currency: 'COP',

    }
    if (window.gtag) {
      gtag('event', 'purchase', {
        transaction_id: orderId || ('cc-' + Date.now()),
        value: value,
        currency: 'COP',
        items: [{
          item_id: items,
          item_name: 'Camisa Polo Premium Hombre',
          item_category: 'Camisas Polo',
          price: value,
          quantity: 1
        }]
      });

<body>

<div class="card">
  <div id="content">
    <div class="spinner"></div>
    <h1>Procesando tu pago...</h1>
    <p class="msg">Estamos confirmando tu transacción con Wompi. Esto toma unos segundos.</p>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const ref = params.get('ref') || params.get('id') || '';
const status = params.get('env') || params.get('status') || 'PENDING';

// Wompi también manda "id" (transaction id) en el redirect. Usamos ref si lo tenemos.
async function checkStatus() {
  if (!ref) {
    render('error');
    return;
  }
  try {
    const r = await fetch('https://pedidos.paquetecompleto.com.co/wompi/status/' + encodeURIComponent(ref));
    const d = await r.json();
    if (d.status === 'APPROVED') { render('approved', d); return; }
    if (d.status === 'DECLINED' || d.status === 'VOIDED' || d.status === 'ERROR') { render('declined', d); return; }
    // PENDING → recheck en 3 segundos
    render('pending');
    setTimeout(checkStatus, 3000);
  } catch(e) { render('error'); }
}

function render(state, data) {
  const c = document.getElementById('content');
  const total = data?.wompi?.amount_in_cents ? '$' + (data.wompi.amount_in_cents / 100).toLocaleString('es-CO') : '';
  const metodo = data?.wompi?.payment_method_type || '';

  if (state === 'approved') {
    c.innerHTML = `
      <div class="icon">✅</div>
      <h1>¡Pago confirmado!</h1>
      <p class="msg">Gracias por tu compra. Recibirás un WhatsApp de confirmación en unos minutos.</p>
      <div class="info">
        <div class="row"><span>Referencia:</span><strong>${ref}</strong></div>
        ${total ? `<div class="row"><span>Total pagado:</span><strong class="status-approved">${total}</strong></div>` : ''}
        ${metodo ? `<div class="row"><span>Método:</span><strong>${metodo}</strong></div>` : ''}
      </div>
      <p class="msg">🚚 Tu pedido entra a cola de despacho. Te enviaremos el tracking pronto.</p>
      <a class="whatsapp" href="https://wa.me/573001234567">💬 Chatéanos por WhatsApp</a>
      <br><a class="cta" href="/">Volver al inicio</a>`;
  } else if (state === 'declined') {
    c.innerHTML = `
      <div class="icon">❌</div>
      <h1 class="status-declined">Pago no procesado</h1>
      <p class="msg">Tu pago fue rechazado o cancelado. Puedes intentar de nuevo con otro método, o elegir <strong>pago contraentrega</strong>.</p>
      <div class="info">
        <div class="row"><span>Referencia:</span><strong>${ref}</strong></div>
        ${data?.wompi?.status ? `<div class="row"><span>Estado:</span><strong class="status-declined">${data.wompi.status}</strong></div>` : ''}
      </div>
      <a class="cta" href="/">Intentar de nuevo</a>`;
  } else if (state === 'pending') {
    // Sigue con spinner + auto-refresh
    return;
  } else {
    c.innerHTML = `
      <div class="icon">⚠️</div>
      <h1>Sin información de pago</h1>
      <p class="msg">No pudimos encontrar tu transacción. Si crees que hubo un pago, escríbenos por WhatsApp con la referencia.</p>
      <a class="whatsapp" href="https://wa.me/573001234567">💬 Contactar soporte</a>
      <br><a class="cta" href="/">Volver al inicio</a>`;
  }
}

checkStatus();
</script>
